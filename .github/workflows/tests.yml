# The checks that need no game files, on every push and pull request. RuntimeChecks reads the installed game's
# assemblies, which a runner does not have: run it locally (see StabilityTests/README.md).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 8.0.x
      # The runner also has newer SDKs, and without a global.json the dotnet CLI picks the newest. Pin the SDK just
      # installed, on the runner only (a global.json in the repository would also pin developers' mod builds).
      - name: Pin the .NET 8 SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force
      - name: Check the SDK in use
        shell: pwsh
        run: |
          $sdk = dotnet --version
          "Using .NET SDK $sdk"
          if ($LASTEXITCODE -ne 0 -or -not "$sdk".StartsWith('8.0.')) { exit 1 }
      # BeaverBuddies/NuGet.Config names only the BepInEx feed and applies only to the mod project. StabilityTests and
      # TimberNet need Newtonsoft.Json from nuget.org, so name that source rather than rely on the runner's defaults.
      - name: Restore
        run: dotnet restore StabilityTests/StabilityTests.csproj --source https://api.nuget.org/v3/index.json
      - name: StabilityTests
        shell: pwsh
        run: |
          # These checks time real threads against the wall clock (sessions of busy game loops, loopback sockets with
          # deadlines). Since 1.4.0-beta10 they run the Stability Fork's steadier way (one ping session after the
          # other, the status check waiting for the init event), but on a shared runner's few cores they can still
          # miss a deadline although nothing is wrong. They still run and show here, but when one of them fails it is a warning, not a red build: run
          # the whole suite locally before a release. Any other failure, or a build error, fails the build.
          $timing = @(
            "A guest's ping over Steam grows with the players' frame length, and pumping between ticks removes that",
            "Status traffic never changes the hash, the event script or tick progress",
            # 1.4.0-beta21: starves the thread pool on purpose and times seven guests' paced saves under the 5 s test limit.
            "J4: seven guests' paced saves, with the thread pool starved, all queue well inside the 10 s",
            # 1.4.0-rc1: compares two timed loops (about 15 ms against 140 ms locally); a busy runner can stall the short one.
            "D-S1: a sampled profiler spot counts every call, times one in 16 and reports it scaled up, for less than a timed spot costs",
            # 1.4.0-rc6: waits 1 to 2 s for a pipe session's fault to cross two threads; missed twice on a runner (rc3, rc6).
            "Host replay failure reaches client before disconnect cleanup"
          )
          dotnet run --project StabilityTests --no-restore | Tee-Object -Variable output
          $code = $LASTEXITCODE
          $failed = @($output | Where-Object { "$_".StartsWith("FAIL ") })
          $tolerated = @($failed | Where-Object { $line = "$_"; @($timing | Where-Object { $line.StartsWith("FAIL ${_}: ") }).Count -gt 0 })
          foreach ($line in $tolerated) { Write-Output "::warning title=Timing check on the runner::$line" }
          if ($failed.Count -gt $tolerated.Count) { exit 1 }
          # A run that ends without its summary line crashed or did not build: that fails whatever was tolerated.
          $summary = @($output | Where-Object { "$_" -match '^\d+/\d+ passed$' })
          if ($code -ne 0 -and ($failed.Count -eq 0 -or $summary.Count -eq 0)) { exit $code }
          exit 0
      - name: Water snapshot comparison (Python)
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s RuntimeChecks -p test_water_snapshots.py
