# The checks that need no game files, on every push and pull request. RuntimeChecks reads the installed game's
# assemblies, which a runner does not have: run it locally (see StabilityTests/README.md).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: StabilityTests
        run: dotnet run --project StabilityTests
      - name: Water snapshot comparison (Python)
        run: python -m unittest discover -s RuntimeChecks -p test_water_snapshots.py
